syntax = "proto3";

package analyzer;

message CVFile{
    string original_name = 1;
    bytes file_content = 2;
}

message AnalyzeCVRequest{
    string job_title = 1;
    string job_description = 2;
    string extra_context = 3;
    repeated CVFile files = 4;
}

message AnalyzeCvResponse {
  string message = 1;
}

service AIService {
  rpc AnalyzeCV (AnalyzeCvRequest) returns (AnalyzeCvResponse);
}

// File Service
message UnzipChunkRequest {
  string original_name = 1;
  bytes file_chunk = 2; // Stream chunking for large zip files
}

message UnzipResponse {
  string message = 1;
  string file_path = 2;
}

service FileService {
  rpc UnzipFile (stream UnzipChunkRequest) returns (UnzipResponse);
}